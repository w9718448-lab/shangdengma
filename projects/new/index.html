从手动描述或已登记对话提取变化，生成待你决策的建议。</small></span></label></div></fieldset><details class="optional-facts"><summary>项目群设置（可选）</summary><div class="form-row"><label>项目群或联系人<input maxlength="80" placeholder="留空则使用「项目名＋项目群」" name="chatName" value=""></label><label>渠道<select name="messageChannel"><option>微信</option><option selected="">飞书</option><option>邮件</option></select></label></div></details><button class="primary-button">生成执行计划</button><p class="form-footnote">当前是可解释的本地工作流模板；礼盒、电商和供应商项目会优先拆出材质、汇报、设计、打样与样品确认。</p></form></section></div><!--$--><!--/$--></main><aside class="ai-rail " aria-label="工作原理"><button class="ai-toggle" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" viewBox="0 0 256 256"><path d="M208,144a15.78,15.78,0,0,1-10.42,14.94L146,178l-19,51.62a15.92,15.92,0,0,1-29.88,0L78,178l-51.62-19a15.92,15.92,0,0,1,0-29.88L78,110l19-51.62a15.92,15.92,0,0,1,29.88,0L146,110l51.62,19A15.78,15.78,0,0,1,208,144ZM152,48h16V64a8,8,0,0,0,16,0V48h16a8,8,0,0,0,0-16H184V16a8,8,0,0,0-16,0V32H152a8,8,0,0,0,0,16Zm88,32h-8V72a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0V96h8a8,8,0,0,0,0-16Z"></path></svg><span class="ai-toggle-vertical">工作原理</span></button></aside></div><script src="../../static-demo.js"></script></body></html>
